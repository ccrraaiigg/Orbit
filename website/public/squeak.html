<html>
  <head>
    <meta charset="utf-8">
    <title>Lam 2300</title>

    <link rel="icon"
	  type="image/png"
	  href="pictures/squeakjs.png">

    <link rel="stylesheet"
	  href="css/squeakjs.css"></head>

  <body>
    <canvas id="squeak"
	    width="1000"
	    height="400"
	    style="visibility: 'invisible';
		   overflow: hidden;
		   position: absolute;
		   top: 0px;
		   left: 0px"></canvas>

    <div id="sqSpinner">
      <div></div></div>

    <script src="js/squeakjs/squeak.js"></script>
    <script src="js/html/utilities.js"></script>
    <script src="js/zlib/bower_components/pako/dist/pako_inflate.min.js"></script>
    <script src="js/orbit-idb-backup.js"></script>
    <script src="js/orbit-version-check.js"></script>
    <script src="js/orbit-image-guard.js"></script>
    <script src="js/orbit-vscode-file.js"></script>
    <script src="js/orbit-workspace-fs.js"></script>

    <script>
      window.top.timedOutCallbacks = []

      window.onload = async function () {
	var magicWindow,
	    squeakDisplay,
	    imageName,
	    zipUrl,
	    windowTitle,
	    isCustomSnapshot

	// Back up the squeak IndexedDB to <workspace>/backups/<timestamp>/
	// before anything (version check, vscode-file write, the VM) can
	// modify it. Never blocks boot on failure.
	try {await window.orbitBackupSqueakIDB()}
	catch (e) {console.warn('squeak IndexedDB backup failed', e)}

	const urlParams = new URLSearchParams(window.top.location.search)

	// Default: the bundled Caffeine image, loaded from
	// memories/caffeine.zip with a "Caffeine" window title.
	imageName = "caffeine"
	zipUrl = null
	windowTitle = "Caffeine"
	isCustomSnapshot = false

	if (urlParams.has('snapshot')) {
	  // The snapshot value is a URL to an alternate image ZIP file.
	  // Use it directly as the zip, and derive the image name and
	  // window title from its basename (stripping any query/fragment,
	  // directory, and the .zip extension).
	  zipUrl = urlParams.get('snapshot')
	  const base = decodeURIComponent(
	    zipUrl.split(/[?#]/)[0].split('/').pop()).replace(/\.zip$/i, '')
	  imageName = base || "caffeine"
	  windowTitle = imageName
	  isCustomSnapshot = true
	} else if (urlParams.has('image')) {
	  // Boot a named local object memory already present in the
	  // page's IndexedDB (e.g. ?image=ableton). No zip is fetched
	  // when the image is already stored; the name doubles as the
	  // window title. Treated as a custom snapshot so the bundled
	  // caffeine.zip version check is skipped for non-caffeine images.
	  imageName = urlParams.get('image') || "caffeine"
	  windowTitle = imageName
	  isCustomSnapshot = imageName !== "caffeine"
	}

	// Reflect the snapshot's name in the embedding window's titlebar.
	try {
	  const host = window.top.document.getElementById('embeddedSqueak')
	  if (host) host.setAttribute('caption', windowTitle)
	} catch (e) {console.warn('could not set Squeak window title', e)}

	// Detect new-version-of-extension by comparing zip-entry sizes;
	// may prompt the user and erase the "squeak" IndexedDB before
	// SqueakJS boots. Only applies to the bundled caffeine.zip.
	if (!isCustomSnapshot) {
	  try {await window.orbitCheckCaffeineZipVersion()}
	  catch (e) {console.warn('orbit version check failed', e)}
	}

	// Record the Orbit webserver's port where the booting image can
	// read it. After the version check, which may erase the database.
	try {await window.orbitWriteVSCodeFile()}
	catch (e) {console.warn('could not write the vscode file', e)}

	// Refuse to auto-boot caffeine.image when the squeak IndexedDB
	// holds more than one *.image file: the user has extra object
	// memories stored, so don't clobber them by booting Caffeine.
	// Any explicitly-named image (?image=/?snapshot=) still boots.
	if (imageName === "caffeine") {
	  try {
	    const imageCount = await window.orbitCountSqueakImages()
	    if (imageCount > 1) {
	      console.warn(
	        'Not starting caffeine.image: ' + imageCount +
	        ' .image files present in the squeak IndexedDB.')
	      return
	    }
	  } catch (e) {console.warn('image-count guard failed; starting anyway', e)}
	}

	console.log('Starting Snowglobe')

	try {magicWindow = window.top.magicWindow}
	catch (exception) {magicWindow = null}

	squeakDisplay = (
	  window.startCaffeine(
	    squeak,
	    imageName,
	    "SqueakV46",
	    {
              appID: "b7837a39-aead-40a9-818e-48bf196d55d9",
              appName: "Lam2300"},
	    zipUrl))

	if (magicWindow) {magicWindow.squeakDisplay = squeakDisplay}}
      </script>

  </body>
</html>
